<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THINK ABOUT IT! — Grade 6 English Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EE; --panel:#FFFFFF; --ink:#1F2937; --ink-soft:#6B7280; --line:#E5E0D3;
  --blue:#3B72D6; --blue-bg:#EAF1FC;
  --purple:#8A63E8; --purple-bg:#F1ECFC;
  --green:#2F9E63; --green-bg:#E9F7EF;
  --orange:#DB8A3A; --orange-bg:#FBF0E2;
  --pink:#DB5E92; --pink-bg:#FBEAF1;
  --gold:#C79A2E; --gold-bg:#FBF3DE;
  --navy:#20303F;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--paper); font-family:'Rubik',sans-serif; color:var(--ink); min-height:100vh; }
.he{ direction:rtl; unicode-bidi:isolate; }
.serif{ font-family:'Frank Ruhl Libre', serif; }
button{ font-family:inherit; }
.app{ max-width:1000px; margin:0 auto; padding:0 18px 60px; }

/* TOP BAR */
.topbar{
  background:var(--navy); color:#EDEAE0; padding:14px 20px; display:flex; align-items:center;
  justify-content:space-between; position:sticky; top:0; z-index:10; border-bottom:3px solid var(--gold);
}
.topbar .brand{ font-weight:800; font-size:0.95rem; letter-spacing:0.3px; }
.topbar .brand small{ display:block; font-weight:400; font-size:0.72rem; color:#B9C2C7; }
.topbar .navbtns{ display:flex; gap:8px; }
.navbtn{
  background:rgba(255,255,255,0.08); color:#EDEAE0; border:1px solid rgba(255,255,255,0.18);
  padding:7px 14px; border-radius:999px; font-size:0.82rem; font-weight:600; cursor:pointer;
  transition:background .15s ease;
}
.navbtn:hover{ background:rgba(255,255,255,0.18); }

/* HOME HERO */
.hero{
  background:var(--navy); color:#EDEAE0; padding:42px 30px 34px; border-radius:0 0 20px 20px;
  margin-bottom:28px; text-align:center;
}
.hero .eyebrow{ font-size:0.75rem; letter-spacing:3px; text-transform:uppercase; color:#9FB0B8; margin-bottom:10px; font-weight:600;}
.hero h1{ font-family:'Frank Ruhl Libre',serif; font-size:2.4rem; margin:0 0 6px; }
.hero .sub{ color:#C9D2CF; font-size:0.95rem; margin-bottom:4px; }
.hero .tagline{ font-family:'Frank Ruhl Libre',serif; font-style:italic; color:var(--gold); font-size:1.1rem; margin-top:14px; }

/* CARDS GRID */
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px; }
@media(max-width:760px){ .grid{ grid-template-columns:1fr; } }
.uCard{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:22px; display:flex; flex-direction:column; gap:10px; transition:transform .15s ease, box-shadow .15s ease;
}
.uCard:hover{ transform:translateY(-3px); box-shadow:0 8px 22px rgba(0,0,0,0.07); }
.uCard .icon{ font-size:2rem; }
.uCard h3{ margin:0; font-size:1.15rem; }
.uCard p.desc{ margin:0; color:var(--ink-soft); font-size:0.85rem; min-height:34px; }
.pbarOuter{ height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.pbarInner{ height:100%; border-radius:99px; transition:width .3s ease; }
.pctLabel{ font-size:0.78rem; color:var(--ink-soft); font-weight:600; }
.startBtn{
  margin-top:6px; border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:0.9rem;
  cursor:pointer; color:#fff;
}

/* SECTION HEADER (unit dashboard) */
.unitHead{ display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.unitHead .icon{ font-size:2.4rem; }
.unitHead h2{ margin:0; font-family:'Frank Ruhl Libre',serif; font-size:1.7rem; }
.unitHead p{ margin:2px 0 0; color:var(--ink-soft); font-size:0.9rem; }

.actGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media(max-width:760px){ .actGrid{ grid-template-columns:1fr 1fr; } }
@media(max-width:480px){ .actGrid{ grid-template-columns:1fr; } }
.actCard{
  border-radius:var(--radius); padding:18px; cursor:pointer; border:1px solid var(--line);
  transition:transform .12s ease, box-shadow .12s ease; position:relative;
}
.actCard:hover{ transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,0.06); }
.actCard .status{ position:absolute; top:14px; left:14px; font-size:1.1rem; }
.actCard .icon{ font-size:1.6rem; margin-bottom:8px; }
.actCard h4{ margin:0 0 4px; font-size:0.98rem; }
.actCard p{ margin:0; font-size:0.78rem; color:var(--ink-soft); }

/* ACTIVITY PAGE CARD */
.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px; margin-bottom:18px; }
.card h2{ font-family:'Frank Ruhl Libre',serif; margin:0 0 4px; font-size:1.4rem; }
.card .actSub{ color:var(--ink-soft); font-size:0.85rem; margin-bottom:20px; }

.tabRow{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.subtab{
  padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper);
  font-weight:600; font-size:0.85rem; cursor:pointer; color:var(--ink-soft);
}
.subtab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* FLASHCARD */
.flash{
  text-align:center; padding:30px 20px; border:2px dashed var(--line); border-radius:var(--radius); background:var(--paper);
}
.flash .word{ font-size:2.1rem; font-weight:800; margin-bottom:6px; display:inline-flex; align-items:center; gap:10px; }
.flash .speaker{ background:var(--blue); color:#fff; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:0.95rem; }
.flash .he{ font-size:1.3rem; color:var(--purple); font-weight:700; margin-bottom:14px; }
.flash .explain{ font-size:0.92rem; color:var(--ink-soft); margin-bottom:10px; }
.flash .example{ font-style:italic; font-size:0.98rem; background:#fff; display:inline-block; padding:8px 16px; border-radius:8px; border:1px solid var(--line); }
.flashNav{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
.flashNav .count{ font-size:0.82rem; color:var(--ink-soft); font-weight:600; }
.pill{
  border:none; padding:9px 18px; border-radius:999px; font-weight:700; font-size:0.85rem; cursor:pointer; color:#fff;
}
.pill:disabled{ opacity:0.35; cursor:default; }
.pill.outline{ background:transparent; color:var(--ink); border:1px solid var(--line); }

/* MC QUESTION */
.qWrap{ margin-bottom:6px; }
.qCounter{ font-size:0.8rem; color:var(--ink-soft); font-weight:600; margin-bottom:10px; }
.prompt{ font-size:1.1rem; font-weight:600; margin-bottom:18px; line-height:1.6; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:520px){ .opts{ grid-template-columns:1fr; } }
.opt{
  text-align:left; padding:13px 16px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
  cursor:pointer; font-size:0.98rem; transition:all .12s ease;
}
.opt:hover{ border-color:var(--ink); }
.opt.correct{ background:var(--green-bg); border-color:var(--green); color:var(--green); font-weight:700; }
.opt.incorrect{ background:var(--pink-bg); border-color:var(--pink); color:var(--pink); font-weight:700; }
.opt.dim{ opacity:0.4; pointer-events:none; }
.feedbackMsg{ margin-top:14px; padding:11px 15px; border-radius:10px; font-size:0.9rem; font-weight:600; }
.feedbackMsg.good{ background:var(--green-bg); color:var(--green); }
.feedbackMsg.bad{ background:var(--pink-bg); color:var(--pink); }
.navRowR{ display:flex; justify-content:flex-end; margin-top:20px; gap:10px; }

/* MATCH */
.matchGrid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media(max-width:560px){ .matchGrid{ grid-template-columns:1fr; } }
.matchCol{ display:flex; flex-direction:column; gap:10px; }
.matchItem{
  padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
  cursor:pointer; font-size:0.95rem; text-align:center; transition:all .12s ease;
}
.matchItem.selected{ border-color:var(--blue); background:var(--blue-bg); font-weight:700; }
.matchItem.matched{ border-color:var(--green); background:var(--green-bg); color:var(--green); font-weight:700; opacity:0.7; pointer-events:none; }
.matchItem.wrong{ border-color:var(--pink); background:var(--pink-bg); }
.matchDone{ text-align:center; padding:20px; font-weight:700; color:var(--green); font-size:1.05rem; }

/* SENTENCE BUILDER */
.answerStrip{
  min-height:52px; border:2px dashed var(--line); border-radius:10px; padding:10px 12px; display:flex;
  flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; background:var(--paper);
}
.chip{
  background:var(--purple); color:#fff; padding:8px 14px; border-radius:8px; font-size:0.92rem; cursor:pointer; border:none; font-weight:600;
}
.chip.pool{ background:var(--panel); color:var(--ink); border:1px solid var(--line); }
.poolRow{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.freeText{
  width:100%; min-height:80px; border:1px solid var(--line); border-radius:10px; padding:12px; font-family:inherit; font-size:0.95rem; resize:vertical;
}

/* GRAMMAR TEACH CARD */
.teachBox{ background:var(--green-bg); border:1px solid var(--green); border-radius:var(--radius); padding:18px 20px; margin-bottom:20px; }
.teachBox h4{ margin:0 0 10px; color:var(--green); }
.ruleRow{ display:flex; justify-content:space-between; padding:5px 0; font-size:0.92rem; border-bottom:1px dashed rgba(0,0,0,0.06); }
.ruleRow b{ color:var(--green); }

/* DETECTIVE */
.detCard{ text-align:center; padding:10px 0; }
.detWrong{ font-size:1.05rem; color:var(--pink); text-decoration:line-through; margin-bottom:14px; }
.detOpts{ display:flex; flex-direction:column; gap:10px; max-width:420px; margin:0 auto; }

/* SPEAKING */
.speakCard{ text-align:center; padding:20px; }
.speakQ{ font-size:1.2rem; font-weight:700; margin-bottom:18px; }
.timerDisp{ font-size:2.4rem; font-weight:800; color:var(--pink); margin:14px 0; font-family:'Frank Ruhl Libre',serif; }
.checklist{ text-align:left; max-width:320px; margin:16px auto; display:flex; flex-direction:column; gap:10px; }
.checklist label{ display:flex; align-items:center; gap:8px; font-size:0.92rem; }

/* PROGRESS PAGE */
.progUnit{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:16px; }
.progUnit h3{ margin:0 0 14px; font-family:'Frank Ruhl Libre',serif; }
.statRow{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:0.9rem; }
.statRow:last-child{ border-bottom:none; }
.overallBarBox{ background:var(--navy); border-radius:var(--radius); padding:26px 28px; color:#EDEAE0; margin-bottom:20px; text-align:center; }
.overallBarBox .big{ font-family:'Frank Ruhl Libre',serif; font-size:1.8rem; margin-bottom:10px; }
.badgeGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media(max-width:600px){ .badgeGrid{ grid-template-columns:1fr 1fr; } }
.badge{ text-align:center; padding:16px 8px; border-radius:12px; border:1px solid var(--line); background:var(--panel); }
.badge.earned{ background:var(--gold-bg); border-color:var(--gold); }
.badge .bIcon{ font-size:1.6rem; opacity:0.3; }
.badge.earned .bIcon{ opacity:1; }
.badge .bLabel{ font-size:0.72rem; margin-top:6px; color:var(--ink-soft); font-weight:600; }
.resetBtn{ margin-top:20px; background:transparent; border:1px solid var(--pink); color:var(--pink); padding:9px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-size:0.85rem; }

/* RESULTS */
.resultBox{ text-align:center; padding:20px 10px 6px; }
.scoreCircle{
  width:100px; height:100px; border-radius:50%; border:4px solid var(--gold); color:var(--gold);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.5rem; margin:0 auto 16px;
  font-family:'Frank Ruhl Libre',serif;
}
.resultBox h3{ font-family:'Frank Ruhl Libre',serif; font-size:1.4rem; margin:0 0 6px; }
.resultBox p{ color:var(--ink-soft); margin:0 0 18px; }

.noteBox{ background:var(--orange-bg); border:1px solid var(--orange); border-radius:10px; padding:10px 14px; font-size:0.82rem; color:#8a5a1e; margin-top:14px; }
.wordCounter{ font-size:0.78rem; color:var(--ink-soft); text-align:left; margin-top:4px; }
.savedMsg{ color:var(--green); font-weight:700; font-size:0.88rem; margin-top:10px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">THINK ABOUT IT! <small>Grade 6 &middot; Gevim School</small></div>
  <div class="navbtns" id="navBtns"></div>
</div>
<div class="app" id="app"></div>

    practiceQ: [

      situational:[

      ]
    },
    sentenceBuilder:{
      items:[
        {words:["hand","your","raise","please"], correct:"please raise your hand"},
        {words:["the","task","complete"], correct:"complete the task"},

        {words:["your","first","write","name"], correct:"write your first name"}
      ],
      freeWord:'dictionary'
    },
    speaking:[
      "What is your first name?","What is your surname?","What languages do you speak?",
      "What is your favorite color?","What is your favorite food?","What is your favorite number?",
      "What is your best friend's first name?","Describe your best friend."
    ],
    writing:{ prompt:"Write 4 sentences about yourself.", starters:["My first name is ___.","My surname is ___.","I like ___.","My favorite ___ is ___."] },

      situations:[
        {p:"You don't understand what the teacher said. What can you say?", o:["Can you repeat, please?","Open your folder.","Guess the answer."], a:"Can you repeat, please?"},

        {p:"You don't know what a word means. What can you use?", o:["a dictionary","a quiz","a task"], a:"a dictionary"}

      vocabPower:['task','folder','quiz','describe'],
      createPrompt:"Write 2–3 things you like to do at school. Use: \"I like to...\""

    finalQuiz:[

      {type:'mc', p:"Can you ___ your name?", o:["spell","raise","guess"], a:"spell"},

  japan: {

      ['afraid','פוחד','feeling fear','I am afraid of dogs.'],
      ['glad','שמח','happy about something','I\'m glad you like it.'],

      ['pick','לבחור','choose something','Pick a color you like.'],
      ['island','אי','land surrounded by water','Japan is an island.'],

      ['clever','חכם','smart','The girl is very clever.'],
      ['mountain','הר','a very high hill','There\'s snow on the mountain.'],
      ['return','לחזור','come back','The monkeys return to the mountain.'],
      ['still','עדיין','continuing until now','She is still in bed.'],
      ['decide','להחליט','choose after thinking','I decided to buy the blue hat.'],
      ['nature','טבע','the natural world','The movie is about nature.'],
      ['the cold','הקור','cold weather','The monkeys enjoy the cold.']
    ],
    matchWords: ['island','popular','afraid','glad','team','million'],
    practiceQ:[
      {p:"I can't see ___ because it's dark.", o:["anything","several","famous"], a:"anything"},
      {p:"Japan is an ___.", o:["island","reason","team"], a:"island"},
      {p:"Football is a very ___ sport.", o:["popular","clever","still"], a:"popular"},
      {p:"I'm ___ you like my new shirt.", o:["glad","afraid","decide"], a:"glad"},
      {p:"There are ___ cookies on the plate.", o:["several","million","mountain"], a:"several"},
      {p:"The man is ___. Everybody knows him.", o:["famous","popular","clever"], a:"famous"},
      {p:"Which sentence uses \"afraid\" correctly?", o:["I'm afraid of dogs.","I'm afraid of the folder.","I'm afraid of dictionary."], a:"I'm afraid of dogs."},

/* ============ PROGRESS CALC ============ */
function unitOverallPct(u){
  const st = S.units[u];
  const unit = UNITS[u];
  let keys = ['learnWords','vocabPractice','sentenceBuilder','speak','write','challenge'];
  if(u==='gs') keys.push('classroomEnglish');
  if(unit.hasGrammar) keys.push('grammarLab');
  if(unit.hasReading) keys.push('read');
  let done=0;
  keys.forEach(k=>{ if(st[k]) done++; });
  if(st.checkYourself.done) done++;
  const total = keys.length+1;
  return Math.round(done/total*100);
}
function earnedBadges(){
  const b = {};
  ['gs','japan'].forEach(u=>{
    const st = S.units[u];
    if(st.vocabPractice) b.vocabMaster = true;
    if(st.sentenceBuilder) b.sentenceBuilderB = true;
    if(st.grammarLab) b.grammarDetective = true;
    if(st.read) b.readingExplorer = true;
    if(st.speak) b.englishSpeaker = true;
    if(st.write) b.englishWriter = true;
    if(st.checkYourself.done && st.checkYourself.score>=9){
      if(u==='gs') b.unitCompletedGs = true; else b.unitCompletedJapan = true;
    }
  });
  return b;
}

/* ============ SPEECH ============ */
function speak(text){
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

/* ---- Generic MC list (used by practiceQ, classroom situational, grammar practice) ---- */
function renderMCSequence(list, opts){
  opts = opts || {};
  if(A.mcIdx===undefined){ A.mcIdx=0; A.mcScore=0; A.mcSelected=null; A.mcAttempts=0; A.mcDone=false; }
  if(A.mcDone){
    return `<div class="matchDone">🎉 Nice work! You completed all ${list.length} questions.</div>
      <div class="navRowR"><button class="pill outline" data-action="mcRestart">Do it again</button>
      <button class="pill" style="background:var(--blue)" data-action="finishActivity" data-key="${opts.completeKey}" data-goto="${opts.goto||''}">${opts.finishLabel||'Done'}</button></div>`;
  }
  const q = list[A.mcIdx];
  const answered = A.mcSelected!==null;
  let fb = '';
  if(answered){
    if(A.mcSelected===q.a) fb = `<div class="feedbackMsg good">✓ Great job!</div>`;
    else if(A.mcAttempts>=2) fb = `<div class="feedbackMsg bad">The correct answer is: ${q.a}</div>`;
    else fb = `<div class="feedbackMsg bad">Try again.</div>`;
  }
  const revealAnswer = answered && (A.mcSelected===q.a || A.mcAttempts>=2);
  return `
  <div class="qWrap">
    <div class="qCounter">Question ${A.mcIdx+1} of ${list.length}</div>
    <div class="prompt">${q.p}</div>
    <div class="opts">
      ${q.o.map(o=>{
        let cls='opt';
        if(revealAnswer){
          if(o===q.a) cls+=' correct';
          else if(o===A.mcSelected) cls+=' incorrect';
          else cls+=' dim';
        } else if(answered && o===A.mcSelected && o!==q.a){
          cls+=' incorrect';
        }
        const locked = revealAnswer ? 'data-locked="1"' : '';
        return `<button class="${cls}" ${locked} data-action="mcSelect" data-opt="${escapeAttr(o)}">${o}</button>`;
      }).join('')}
    </div>
    ${fb}
  </div>
  <div class="navRowR">
    <button class="pill" style="background:var(--ink)" data-action="mcNext" ${revealAnswer?'':'disabled'}>${A.mcIdx===list.length-1?'Finish':'Next →'}</button>
  </div>`;
}

/* ---- Generic Match ---- */
function renderMatch(pairs, opts){
  if(A.mLeft===undefined){
    A.mLeft = shuffle(pairs.map(p=>p[0]));
    A.mRight = shuffle(pairs.map(p=>p[1]));
    A.mMatched = []; A.mSelLeft=null; A.mSelRight=null; A.mWrong=null;
    A.mPairs = pairs;
  }
  if(A.mMatched.length===pairs.length){
    return `<div class="matchDone">🎉 Great work! You matched all the words correctly.</div>
      <div class="navRowR"><button class="pill outline" data-action="matchRestart">Shuffle again</button>
      <button class="pill" style="background:var(--blue)" data-action="finishActivity" data-key="${opts.onComplete}" data-goto="">Mark Complete</button></div>`;
  }
  return `
  <div class="matchGrid">
    <div class="matchCol">
      ${A.mLeft.map(w=>{
        const matched = A.mMatched.includes(w);
        const sel = A.mSelLeft===w;
        let cls='matchItem'+(matched?' matched':'')+(sel?' selected':'')+(A.mWrong==='L:'+w?' wrong':'');
        return `<button class="${cls}" data-action="matchPick" data-side="L" data-val="${escapeAttr(w)}" ${matched?'disabled':''}>${w}</button>`;
      }).join('')}
    </div>
    <div class="matchCol">
      ${A.mRight.map(w=>{
        const matched = A.mMatched.some(l=>A.mPairs.find(p=>p[0]===l)[1]===w);
        const sel = A.mSelRight===w;
        let cls='matchItem'+(matched?' matched':'')+(sel?' selected':'')+(A.mWrong==='R:'+w?' wrong':'');
        return `<button class="${cls}" data-action="matchPick" data-side="R" data-val="${escapeAttr(w)}" ${matched?'disabled':''}>${w}</button>`;
      }).join('')}
    </div>
  </div>`;
}

  const tabs = `<div class="tabRow">

    <button class="subtab ${A.ceTab==='situations'?'active':''}" data-action="setCeTab" data-tab="situations">What Should They Say?</button>

  let body='';

  return tabs+body;
}

/* ---- Grammar Lab ---- */
function renderGrammarLab(unit){
  if(A.glTab===undefined) A.glTab='toBe';
  const g = unit.grammar;
  const tabs = `<div class="tabRow">
    <button class="subtab ${A.glTab==='toBe'?'active':''}" data-action="setGlTab" data-tab="toBe">To Be</button>
    <button class="subtab ${A.glTab==='toHave'?'active':''}" data-action="setGlTab" data-tab="toHave">To Have</button>
    <button class="subtab ${A.glTab==='questions'?'active':''}" data-action="setGlTab" data-tab="questions">Questions</button>
    <button class="subtab ${A.glTab==='detective'?'active':''}" data-action="setGlTab" data-tab="detective">🔎 Grammar Detective</button>
  </div>`;
  let body='';
  if(A.glTab==='toBe'){
    body = teachBox('To Be', [['I','am'],['He / She / It','is'],['You / We / They','are']]) + renderMCSequence(g.toBe, {completeKey:'grammarLab', finishLabel:'Mark Grammar Lab Complete'});
  } else if(A.glTab==='toHave'){
    body = teachBox('To Have', [['I / You / We / They','have'],['He / She / It','has']]) + renderMCSequence(g.toHave, {completeKey:'grammarLab', finishLabel:'Mark Grammar Lab Complete'});
  } else if(A.glTab==='questions'){
    body = teachBox('Yes/No &amp; Wh- Questions', [['Am / Is / Are','+ subject ...?'],['What / Where / Who / When / Why','+ am/is/are ...?']]) + renderMCSequence(g.questions, {completeKey:'grammarLab', finishLabel:'Mark Grammar Lab Complete'});
  } else {
    body = renderDetective(g.detective, {completeKey:'grammarLab'});
  }
  return tabs+body;
}
function teachBox(title, rows){
  return `<div class="teachBox"><h4>${title}</h4>${rows.map(r=>`<div class="ruleRow"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;

/* ---- Grammar Detective ---- */
function renderDetective(list, opts){
  if(A.detIdx===undefined){ A.detIdx=0; A.detSolved=null; }
  if(A.detIdx>=list.length){
    return `<div class="matchDone">🔎 All cases solved!</div>
    <div class="navRowR"><button class="pill" style="background:var(--blue)" data-action="finishActivity" data-key="${opts.completeKey}" data-goto="">Mark Complete</button></div>`;
  }
  const item = list[A.detIdx];
  const choices = shuffle([item.wrong, item.right]);
  return `
  <div class="detCard">
    <div class="qCounter">Case ${A.detIdx+1} of ${list.length}</div>
    <p style="font-size:0.9rem;color:var(--ink-soft);">Which sentence is correct?</p>
    <div class="detOpts">
      ${choices.map(c=>{
        let cls='opt';
        if(A.detSolved!==null){

      }).join('')}
    </div>
    ${A.detSolved==='correct' ? '<div class="feedbackMsg good">Case solved! 🔎</div>' : (A.detSolved==='wrong' ? '<div class="feedbackMsg bad">Not quite — look again.</div>' : '')}

function renderQuiz(unit){

    let tier;
    if(scaledScore>=9) tier = {icon:'⭐', title:'Excellent!', msg:'You are ready to move on.'};
    else if(scaledScore>=7) tier = {icon:'👍', title:'Good job!', msg:'Try the challenge and review a few words.'};
    else tier = {icon:'🔄', title:"Let's practice a little more.", msg:'Review the vocabulary and grammar sections, then try again.'};
    return `
    <div class="resultBox">
      <div class="scoreCircle">${scaledScore}/10</div>
      <h3>${tier.icon} ${tier.title}</h3>
      <p>${tier.msg}</p>
      <div class="navRowR" style="justify-content:center;">
        <button class="pill outline" data-action="quizRestart">Practice Again</button>

    body = `

}

/* ============ HELPERS ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function heLine(text){ return `<div class="he" dir="rtl" style="font-size:0.82rem;color:var(--ink-soft);margin-top:3px;">${text}</div>`; }

/* ============ MASTER RENDER ============ */
function render(){
  renderNavBtns();
  const app = document.getElementById('app');
  if(S.view==='home') app.innerHTML = renderHome();
  else if(S.view==='unit') app.innerHTML = renderUnit();
  else if(S.view==='activity') app.innerHTML = renderActivity();
  else if(S.view==='progress') app.innerHTML = renderProgress();

/* ============ EVENT DELEGATION ============ */
document.getElementById('app').addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const act = t.dataset.action;
  const unit = UNITS[S.unitId];

  if(act==='openUnit'){ openUnit(t.dataset.unit); return; }
  if(act==='openProgress'){ openProgress(); return; }
  if(act==='openActivity'){ openActivity(t.dataset.act); return; }
  if(act==='speak'){ speak(t.dataset.text); return; }

  if(act==='flashPrev'){ A.fIdx = Math.max(0, A.fIdx-1); render(); return; }
  if(act==='flashNext'){ A.fIdx = Math.min(unit.vocab.length-1, A.fIdx+1); render(); return; }

  if(act==='finishActivity'){
    S.units[S.unitId][t.dataset.key] = true;
    if(t.dataset.goto){ A={}; S.activityId = t.dataset.goto; render(); }
    else backToUnit();
    return;
  }

  if(act==='setVpTab'){ A.vpTab = t.dataset.tab; delete A.mLeft; delete A.mcIdx; render(); return; }
  if(act==='setCeTab'){ A.ceTab = t.dataset.tab; delete A.mLeft; delete A.mcIdx; render(); return; }
  if(act==='setGlTab'){ A.glTab = t.dataset.tab; delete A.mcIdx; delete A.detIdx; render(); return; }
  if(act==='setRdTab'){ A.rdTab = t.dataset.tab; render(); return; }
  if(act==='setChTab'){ A.chTab = t.dataset.tab; delete A.mcIdx; delete A.detIdx; render(); return; }

  if(act==='mcSelect'){
    if(t.hasAttribute('data-locked')) return;
    let list;
    if(S.activityId==='vocabPractice') list = unit.practiceQ;
    else if(S.activityId==='classroomEnglish') list = unit.classroom.situational;
    else if(S.activityId==='grammarLab'){
      list = A.glTab==='toBe'?unit.grammar.toBe:A.glTab==='toHave'?unit.grammar.toHave:unit.grammar.questions;
    } else if(S.activityId==='challenge') list = unit.challenge.situations;
    const q = list[A.mcIdx];
    const chosen = t.dataset.opt;
    if(A.mcSelected===q.a){ return; } // already correct, locked
    A.mcAttempts = (A.mcAttempts||0)+1;
    A.mcSelected = chosen;
    if(chosen===q.a) A.mcScore = (A.mcScore||0)+1;
    render(); return;
  }
  if(act==='mcNext'){
    let list;
    if(S.activityId==='vocabPractice') list = unit.practiceQ;
    else if(S.activityId==='classroomEnglish') list = unit.classroom.situational;
    else if(S.activityId==='grammarLab'){ list = A.glTab==='toBe'?unit.grammar.toBe:A.glTab==='toHave'?unit.grammar.toHave:unit.grammar.questions; }
    else if(S.activityId==='challenge') list = unit.challenge.situations;
    if(A.mcIdx < list.length-1){ A.mcIdx++; A.mcSelected=null; A.mcAttempts=0; }
    else { A.mcDone = true; }
    render(); return;
  }
  if(act==='mcRestart'){ delete A.mcIdx; delete A.mcDone; delete A.mcScore; render(); return; }

  if(act==='matchPick'){
    const side=t.dataset.side, val=t.dataset.val;
    if(side==='L') A.mSelLeft = (A.mSelLeft===val? null: val);
    else A.mSelRight = (A.mSelRight===val? null: val);
    if(A.mSelLeft && A.mSelRight){
      const pair = A.mPairs.find(p=>p[0]===A.mSelLeft);
      if(pair && pair[1]===A.mSelRight){
        A.mMatched.push(A.mSelLeft); A.mWrong=null;
      } else {
        A.mWrong = 'L:'+A.mSelLeft;
        setTimeout(()=>{ A.mWrong=null; render(); }, 500);
      }
      A.mSelLeft=null; A.mSelRight=null;
    }
    render(); return;
  }
  if(act==='matchRestart'){ delete A.mLeft; render(); return; }

  if(act==='sbAdd'){
    const idx = parseInt(t.dataset.idx);
    A.sbChosen.push(A.sbPool[idx]);
    A.sbPool.splice(idx,1);
    A.sbResult=null;
    render(); return;
  }
  if(act==='sbRemove'){
    const idx = parseInt(t.dataset.idx);
    A.sbPool.push(A.sbChosen[idx]);
    A.sbChosen.splice(idx,1);
    A.sbResult=null;
    render(); return;
  }
  if(act==='sbClear'){
    A.sbPool = A.sbPool.concat(A.sbChosen);
    A.sbChosen = [];
    A.sbResult=null;
    render(); return;
  }
  if(act==='sbCheck'){
    const item = unit.sentenceBuilder.items[A.sbIdx];
    const built = A.sbChosen.join(' ').toLowerCase().replace(/[.,!?]/g,'');
    A.sbResult = (built===item.correct) ? 'correct' : 'incorrect';
    render(); return;
  }
  if(act==='sbNext'){
    A.sbIdx++;
    if(A.sbIdx < unit.sentenceBuilder.items.length){
      A.sbChosen=[]; A.sbPool = shuffle(unit.sentenceBuilder.items[A.sbIdx].words.slice()); A.sbResult=null;
    }
    render(); return;
  }
  if(act==='sbSaveFree'){ A.sbSaved = true; render(); return; }

  if(act==='detPick'){
    const val = t.dataset.val, right = t.dataset.right;
    A.detSolved = (val===right) ? 'correct' : 'wrong';
    render(); return;
  }
  if(act==='detNext'){
    A.detIdx++; A.detSolved=null; render(); return;
  }

  if(act==='spStart'){
    if(A.spRunning) return;
    A.spRunning = true; render();
    const timer = setInterval(()=>{
      A.spTimer--;
      if(A.spTimer<=0){ clearInterval(timer); A.spRunning=false; A.spTimer=20; }
      render();
    }, 1000);
    return;
  }
  if(act==='spNext'){
    A.spIdx++; A.spTimer=20; A.spRunning=false; A.spCheck=[false,false,false,false];
    render(); return;
  }

  if(act==='rdFindSave'){ A.rdFindSaved = true; render(); return; }
  if(act==='rdTfPick'){ A.rdTfPicked = t.dataset.val; render(); return; }
  if(act==='rdChoosePick'){ A.rdChoosePicked = t.dataset.val; render(); return; }
  if(act==='rdThinkSave'){ A.rdThinkSaved = true; render(); return; }

  if(act==='wrStarter'){
    const s = unit.writing.starters[parseInt(t.dataset.idx)];
    A.wrText = (A.wrText? A.wrText+'\\n' : '') + s;
    render(); return;
  }
  if(act==='wrSave'){ A.wrSaved = true; render(); return; }

  if(act==='vpSave'){ A.vpSaved = true; render(); return; }
  if(act==='crSave'){ A.crSaved = true; render(); return; }

  if(act==='qzSelect'){
    if(A.qzSelected!==null) return;
    const q = unit.finalQuiz[A.qzIdx];
    A.qzSelected = t.dataset.opt;
    if(A.qzSelected===q.a) A.qzScore++;
    render(); return;
  }
  if(act==='qzNext'){
    A.qzIdx++; A.qzSelected=null; A.qzOpenText='';
    render(); return;
  }
  if(act==='quizRestart'){
    A.qzIdx=0; A.qzScore=0; A.qzSelected=null; A.qzOpenText='';
    render(); return;
  }
  if(act==='quizFinish'){
    S.units[S.unitId].checkYourself = { done:true, score: parseInt(t.dataset.score) };
    backToUnit(); return;
  }

  if(act==='resetAsk'){ S.confirmReset = true; render(); return; }
  if(act==='resetConfirmYes'){
    S.units = { gs: freshUnitState(), japan: freshUnitState() };
    S.confirmReset = false; render(); return;
  }
  if(act==='resetConfirmNo'){ S.confirmReset = false; render(); return; }
});

/* text inputs — update state without full re-render (keeps focus) */
document.getElementById('app').addEventListener('input', function(e){
  const t = e.target;
  const act = t.dataset.action;
  if(act==='sbFreeInput'){ A.sbFreeText = t.value; A.sbSaved=false; }
  else if(act==='rdFindInput'){ A.rdFindText = t.value; A.rdFindSaved=false; }
  else if(act==='rdThinkInput'){ A.rdThinkText = t.value; A.rdThinkSaved=false; }
  else if(act==='wrInput'){
    A.wrText = t.value; A.wrSaved=false;
    const counter = t.parentElement.querySelector('.wordCounter');
    if(counter){ const wc = t.value.trim().length? t.value.trim().split(/\\s+/).length:0; counter.textContent = wc+' words'; }
  }
  else if(act==='vpInput'){
    if(A.vpValues===undefined) A.vpValues=[];
    A.vpValues[parseInt(t.dataset.idx)] = t.value; A.vpSaved=false;
  }
  else if(act==='crInput'){ A.crText = t.value; A.crSaved=false; }
  else if(act==='qzOpenInput'){ A.qzOpenText = t.value; }
});
document.getElementById('app').addEventListener('change', function(e){
  const t = e.target;
  if(t.dataset.action==='spCheck'){
    A.spCheck[parseInt(t.dataset.idx)] = t.checked;
  }
});

render();
</script>
