<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
<title id="t">Three children sit on the floor with board games. One of them is reading a card.</title>
<rect width="320" height="200" fill="#F6F2EA"/>
<!-- floor -->
<path d="M0 162h320" stroke="#E0D7C4" stroke-width="3"/>
<!-- board game in the middle -->
<rect x="112" y="128" width="88" height="32" rx="4" fill="#FFFDF9" stroke="#46658A" stroke-width="2.5"/>
<g fill="#E8E1D5">
  <rect x="120" y="134" width="18" height="9"/><rect x="156" y="134" width="18" height="9"/>
  <rect x="138" y="145" width="18" height="9"/><rect x="174" y="145" width="18" height="9"/>
</g>
<circle cx="129" cy="150" r="5" fill="#C9A25A"/>
<circle cx="183" cy="139" r="5" fill="#8FA68C"/>
<!-- child on the left, sitting, legs forward -->
<g>
  <circle cx="54" cy="92" r="17" fill="#D9B892"/>
  <path d="M54 75a17 17 0 0 1 17 14 40 40 0 0 0-34 0 17 17 0 0 1 17-14z" fill="#6B4F3A"/>
  <path d="M36 142v-26a18 18 0 0 1 36 0v26z" fill="#C9A25A"/>
  <path d="M40 150 h50" stroke="#46658A" stroke-width="13" stroke-linecap="round"/>
</g>
<!-- child in the middle, back to us, leaning over the board -->
<g>
  <circle cx="156" cy="82" r="16" fill="#D9B892"/>
  <path d="M156 66a16 16 0 0 1 16 14 38 38 0 0 0-32 0 16 16 0 0 1 16-14z" fill="#2F2A26"/>
  <path d="M139 126v-22a17 17 0 0 1 34 0v22z" fill="#8FA68C"/>
</g>
<!-- child on the right, reading a card -->
<g>
  <circle cx="258" cy="92" r="17" fill="#D9B892"/>
  <path d="M258 75a17 17 0 0 1 17 14 40 40 0 0 0-34 0 17 17 0 0 1 17-14z" fill="#4A3B2E"/>
  <path d="M240 142v-26a18 18 0 0 1 36 0v26z" fill="#46658A"/>
  <path d="M276 150 h-50" stroke="#C9A25A" stroke-width="13" stroke-linecap="round"/>
  <!-- the card she is reading -->
  <path d="M234 108 L226 118" stroke="#D9B892" stroke-width="9" stroke-linecap="round"/>
  <g transform="rotate(-12 218 114)">
    <rect x="204" y="98" width="28" height="34" rx="3" fill="#FFFDF9" stroke="#46658A" stroke-width="2.5"/>
    <g stroke="#C9BDA7" stroke-width="2" stroke-linecap="round">
      <path d="M210 108h16"/><path d="M210 114h16"/><path d="M210 120h10"/>
    </g>
  </g>
</g>
<!-- a second game, still in its box, in front of them -->
<rect x="120" y="166" width="66" height="24" rx="4" fill="#8FA68C"/>
<rect x="120" y="166" width="66" height="8" rx="4" fill="#788E75"/>
</svg>
